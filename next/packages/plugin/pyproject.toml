[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-plugin-kit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]
description = "Explicit portable plugin loading and MCP tool binding"

[tool.setuptools]
packages = ["plugin"]
package-dir = {plugin = "src"}
