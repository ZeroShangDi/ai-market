[build-system]
requires = ["setuptools==75.3.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-voice-kit"
version = "0.1.0"
description = "Independent speech recognition, synthesis and local audio package"
requires-python = ">=3.9"
dependencies = ["httpx==0.28.1", "sounddevice==0.5.1"]

[tool.setuptools]
packages = ["voice"]
package-dir = { voice = "src" }
