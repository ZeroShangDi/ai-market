<text x="1038" y="183" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#0f172a" font-weight="600" text-anchor="start">projects/desktop</text>
<text x="1038" y="210" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="start">复用 PC Web · 桌面系统能力</text>
