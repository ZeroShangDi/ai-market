<text x="306" y="597" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#0f172a" font-weight="600" text-anchor="start">选择模块能力 → 组合多端页面 → 编排业务流程 → 配置角色权限</text>
<text x="306" y="632" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">应用内部定义组合；构建、部署、升级交给 ops</text>
