<text x="670" y="183" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#0f172a" font-weight="600" text-anchor="start">projects/mobile</text>
<text x="670" y="210" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="start">应用入口 · 扫码 · 原生能力</text>
