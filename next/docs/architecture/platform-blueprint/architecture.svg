<text x="288" y="1147" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#475569" font-weight="400" text-anchor="start">基础能力可内置于 projects，确需共享时再提取到 packages。</text>
<text x="48" y="1210" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#334155" font-weight="500" text-anchor="start">读图方式：沿中间箭头自下向上阅读。模块 ≠ 应用 ≠ 部署单元。</text>
<text x="48" y="1240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">说明：这是未来逻辑分层，不表示当前已实现，也不要求每个方框独立部署。</text>
