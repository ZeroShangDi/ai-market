<text x="72" y="372" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#475569" font-weight="600" text-anchor="start">02 · 产品形态</text>
<text x="72" y="409" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">apps</text>
