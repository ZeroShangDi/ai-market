<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
<title id="title">多端应用平台：目标逻辑架构</title><desc id="desc">自下向上，领域模块提供能力，代码与配置组合能力并生成应用，前端工程挂载应用。底部基础设施工程支撑所有层。此图是目标设计，不是当前部署图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect width="1440" height="1260" fill="#f8fafc"/>
<text x="48" y="59" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#0f172a" font-weight="700" text-anchor="start">多端应用平台</text>
<text x="48" y="94" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">目标逻辑架构  /  模块提供能力，应用形成闭环，宿主提供入口</text>
<text x="1392" y="58" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b" font-weight="400" text-anchor="end">架构草案 · 2026.10.13</text>
