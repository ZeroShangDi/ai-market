<text x="1130" y="826" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="start">跟进 · 工单 · 拓客等</text>
<text x="288" y="896" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#334155" font-weight="500" text-anchor="start">每个模块按需包含：后端实现 ｜ PC 页面 ｜ 移动页面 ｜ MCP 接口 ｜ SKILL ｜ 连接器</text>
<text x="288" y="928" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">模块之间通过公开 API / 事件协作；不同应用可以复用同一模块实例。</text>
