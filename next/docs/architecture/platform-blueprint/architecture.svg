<text x="72" y="821" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">modules</text>
<text x="72" y="853" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="start">具体领域边界待分析</text>
