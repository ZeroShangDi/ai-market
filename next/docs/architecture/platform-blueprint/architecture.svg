<text x="72" y="203" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">前端工程</text>
<text x="72" y="235" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="start">承载和展示应用</text>
