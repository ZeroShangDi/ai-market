# Include inside nginx's http {}. Replace domain, certificates, root and upstreams.
# Local host stays behind Tailscale; never expose Control/Voice shared credentials.
server {
    listen 443 ssl;
    server_name mobile.example.com;
    ssl_certificate /etc/nginx/tls/mobile.crt;
    ssl_certificate_key /etc/nginx/tls/mobile.key;
    root /srv/assistant/dist/build/h5;
    # Avoid logging ticket/query/fragment-bearing user entry URLs.
    access_log off;
    location / { try_files $uri $uri/ /index.html; }
    location /admin-api/ {
        proxy_set_header Cookie '';
        proxy_hide_header Set-Cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Container-App '';
        proxy_pass http://127.0.0.1:48090;
    }
    location /mobile-host/ {
        # Replace with the local machine's protected tailnet endpoint when remote.
        proxy_pass http://127.0.0.1:5193;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Cookie '';
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_next_upstream off;
        client_max_body_size 32k;
    }
}
