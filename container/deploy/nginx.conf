# Replace hostnames, certificates and the approved-apps map before deployment.
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # Query strings can contain short-lived authorization codes; do not log them.
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /var/log/nginx/access.log safe;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $ssl_client_fingerprint $verified_app {
    default '';
    include /etc/nginx/approved-apps.map;
  }
  upstream foundation { server 127.0.0.1:48090; keepalive 16; }
  server {
    listen 80;
    server_name admin.foundation.example services.foundation.example;
    return 308 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name admin.foundation.example;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    root /srv/container/pc/dist;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/admin-api/system/auth/(login|register|sms-login|send-sms-code|reset-password)$ {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Container-App '';
      # Token APIs do not receive or replace the monitor's browser session.
      proxy_set_header Cookie '';
      proxy_hide_header Set-Cookie;
      proxy_pass http://foundation;
    }
    location /admin-api/ {
      limit_req zone=api burst=30 nodelay;
      client_max_body_size 256m;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Container-App '';
      # Token APIs do not receive or replace the monitor's browser session.
      proxy_set_header Cookie '';
      proxy_hide_header Set-Cookie;
      proxy_pass http://foundation;
    }
    location /infra/ws {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://foundation;
    }
    location ~ ^/(admin|druid)(/|$) {
      # Monitor authentication stays independent; do not disable its CSRF/CSP.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://foundation;
    }
    location /api/v1/app-updates/ {
      limit_req zone=api burst=30 nodelay;
      proxy_set_header Host $http_host;
      proxy_pass http://foundation;
    }
  }
  # For confidential application backends/BFFs, never for a secret embedded in JS/APK.
  server {
    listen 443 ssl;
    server_name services.foundation.example;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/apps-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location /service-api/ {
      if ($verified_app = '') { return 403; }
      limit_req zone=api burst=30 nodelay;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Container-App $verified_app;
      proxy_set_header Cookie '';
      proxy_hide_header Set-Cookie;
      proxy_pass http://foundation/admin-api/;
    }
    location / { return 404; }
  }
}
