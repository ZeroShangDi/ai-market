[project]
name = "ai-market-voice"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pipecat-ai[webrtc,silero,openai]==1.12.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
mlx = ["mlx-audio[tts,stt]==0.5.7; sys_platform == 'darwin'"]

[project.scripts]
ai-market-voice = "voice_service.server:main"
ai-market-qwen-tts = "voice_service.qwen_tts:main"
ai-market-qwen-asr = "voice_service.qwen_asr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_service"]
