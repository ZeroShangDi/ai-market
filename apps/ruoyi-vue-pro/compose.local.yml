name: yudao-local

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - yudao-local-mysql:/var/lib/mysql
      - ./yudao-module-callphone/src/main/resources/sql/mysql/callphone-outbound-v1.sql:/docker-entrypoint-initdb.d/00-callphone-schema.sql:ro
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/ruoyi-vue-pro.sql:ro
      - ./yudao-module-callphone/src/main/resources/sql/mysql/callphone-menu-v1.sql:/docker-entrypoint-initdb.d/zz-callphone-menu.sql:ro
      - ./yudao-module-callphone/src/main/resources/sql/mysql:/callphone-migrations:ro
      - ./script/mysql-init-callphone.sh:/docker-entrypoint-initdb.d/zzz-callphone-migrations.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - yudao-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: yudao-server/Dockerfile
    restart: unless-stopped
    ports:
      - "${CALLPHONE_API_BIND_HOST:-127.0.0.1}:48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: "-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom"
      ARGS: >-
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=123456
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - yudao-local-callphone-backups:/yudao-server/data/callphone/backups
      - yudao-local-callphone-recordings:/yudao-server/data/callphone/recordings

volumes:
  yudao-local-mysql:
  yudao-local-redis:
  yudao-local-callphone-backups:
  yudao-local-callphone-recordings:
