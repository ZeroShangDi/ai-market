<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' https://pet.invalid; connect-src 'none'">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:100%;height:100%;display:block;pointer-events:none}</style>
<canvas width="640" height="640"></canvas>
<script>
'use strict';
(() => {
  const canvas = document.querySelector('canvas');
  let gl, texture, video, raf = 0, serial = 0, timer, dead = false;
  let manifest = [], started = false;
  const signal = (type, id, token, code = '') => {
    if (!dead && window.PetHost) PetHost.signal(type, id, token, code);
  };
  function shader(type, source) {
    const value = gl.createShader(type); gl.shaderSource(value, source); gl.compileShader(value);
    if (!gl.getShaderParameter(value, gl.COMPILE_STATUS)) throw new Error('SHADER_FAILED');
    return value;
  }
  function setup() {
    gl = canvas.getContext('webgl', {alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: false});
    if (!gl) throw new Error('WEBGL_UNAVAILABLE');
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 uv;void main(){uv=vec2((p.x+1.0)*0.5,(1.0-p.y)*0.5);gl_Position=vec4(p,0.0,1.0);}'));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float;uniform sampler2D frame;varying vec2 uv;void main(){vec3 rgb=texture2D(frame,vec2(uv.x*0.5,uv.y)).rgb;float a=texture2D(frame,vec2(0.5+uv.x*0.5,uv.y)).r;a=a<0.02?0.0:(a>0.98?1.0:a);gl_FragColor=vec4(rgb,a);}'));
    gl.linkProgram(program); if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('SHADER_LINK_FAILED');
    gl.useProgram(program);
    const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'p'); gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
    texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(program,'frame'),0); gl.viewport(0,0,canvas.width,canvas.height);
  }
  function releaseVideo() {
    cancelAnimationFrame(raf); clearTimeout(timer);
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); video = null; }
  }
  window.petPlayer = {
    configure(actions) {
      if (started || dead) return; started = true; manifest = actions;
      try { setup(); signal('boot', '', 0); }
      catch (_) { signal('error', '', 0, 'RENDERER_UNAVAILABLE'); }
    },
    play(id, token) {
      if (dead || !gl) return;
      const action = manifest.find(item => item.id === id); if (!action) return;
      const request = ++serial; releaseVideo();
      const current = document.createElement('video'); video = current;
      current.muted = true; current.playsInline = true; current.preload = 'auto'; current.loop = false;
      let first = true, failed = false, remaining = action.repeats, lastFrame = -1;
      const fail = code => {
        if (request !== serial || dead || failed) return; failed = true; releaseVideo(); signal('error',id,token,code);
      };
      timer = setTimeout(() => fail('VIDEO_START_TIMEOUT'), 6500);
      current.onerror = () => fail('VIDEO_DECODE_FAILED');
      current.onended = () => {
        if (request !== serial || dead || failed) return;
        if (--remaining > 0) { current.currentTime = 0; current.play().catch(() => fail('VIDEO_PLAY_FAILED')); }
        else { cancelAnimationFrame(raf); signal('ended',id,token); }
      };
      function draw() {
        if (request !== serial || dead || failed) return;
        const frame = current.getVideoPlaybackQuality ? current.getVideoPlaybackQuality().totalVideoFrames : current.currentTime;
        if (current.readyState >= 2 && current.videoWidth > 0 && frame !== lastFrame) {
          lastFrame = frame;
          try {
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,current);
            gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
            if (gl.getError() !== gl.NO_ERROR) return fail('VIDEO_RENDER_FAILED');
            if (first) { first = false; clearTimeout(timer); signal('frame',id,token); }
          } catch (_) { return fail('VIDEO_RENDER_FAILED'); }
        }
        raf = requestAnimationFrame(draw);
      }
      current.src = 'https://pet.invalid/clip/' + encodeURIComponent(id);
      current.play().then(draw).catch(() => fail('VIDEO_PLAY_FAILED'));
    },
    dispose() { dead = true; serial++; releaseVideo(); if (gl) { gl.deleteTexture(texture); gl.getExtension('WEBGL_lose_context')?.loseContext(); } }
  };
  canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); signal('error','',0,'WEBGL_CONTEXT_LOST'); });
})();
</script>
