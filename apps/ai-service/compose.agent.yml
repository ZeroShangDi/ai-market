# Merge after ../ruoyi-vue-pro/compose.local.yml; paths resolve from its directory.
services:
  agent-service:
    profiles: [agent]
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../agent-service/.env.local
    environment:
      AGENT_BIND_HOST: 0.0.0.0
      AGENT_PORT: 48082
      AGENT_DATA_DIR: /data
    expose: ["48082"]
    volumes:
      - yudao-local-agent:/data
    mem_limit: 1g
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=268435456
    security_opt:
      - no-new-privileges:true
      - systempaths=unconfined
      - seccomp:../agent-service/security/work-seccomp.json
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:48082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    environment:
      AGENT_SERVICE_URL: http://agent-service:48082
  ai-service:
    environment:
      AGENT_SERVICE_URL: http://agent-service:48082
volumes:
  yudao-local-agent:
